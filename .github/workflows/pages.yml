# Publishes the site to GitHub Pages with a real page per open job (for Google for Jobs).
# Runs on every push to main, every hour (so new, edited and closed jobs show up), and on demand
# from the Actions tab. One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions".
name: Publish site and job pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # History for the last few builds' asset files (see build-job-pages.mjs).
          fetch-depth: 40
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build job pages, sitemap and robots.txt
        # The site's address for job links and the sitemap (the custom domain itself is set in
        # Settings > Pages; there is no CNAME file in the repo).
        env:
          SITE_URL: https://recruitment.pronextglobal.com
        run: node scripts/build-job-pages.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
